# DigitalOcean App Platform spec for Possessed (specs/08 §8.1). Contains no secrets:
# GEMINI_API_KEY is declared as a SECRET and its value is set in the DigitalOcean dashboard.
name: possessed
region: blr
services:
  - name: web
    github:
      repo: huzaifa282/possessed
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health?live=1
      initial_delay_seconds: 20
    envs:
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MODEL_PROVIDER
        scope: RUN_TIME
        value: gemini-gemma
      - key: GEMMA_MODELS
        scope: RUN_TIME
        value: gemma-4-31b-it,gemma-4-26b-a4b-it
      - key: RATE_LIMIT_PER_HOUR
        scope: RUN_TIME
        value: "20"
